<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - My Blog</title>
<link rel="stylesheet" href="css/Stylesheet.css">
</head>

<body>

<header class="site-header">
<a class="logo" href="index.html">Studio</a>
<nav>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="components.html">Components</a></li>
<li><a href="about.html">About</a></li>
<li><a class="active" href="contact.html">Contact</a></li>
</ul>
</nav>
</header>

<main id="main-content" class="container">

<section class="section">
<h1>Contact Me</h1>
<p class="label">Fill in the form below and I will get back to you as soon as possible.</p>
</section>

<section class="section">
<form class="card contact-form" action="#" method="get">

<div class="form-group">
<label for="name">Name</label>
<input type="text" id="name" name="name" autocomplete="name" placeholder="Your full name">
</div>

<div class="form-group">
<label for="email">Email</label>
<input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com">
</div>

<div class="form-row">
<div class="form-group">
<label for="age">Age</label>
<input type="number" id="age" name="age" placeholder="18">
</div>

<div class="form-group">
<label for="date">Date</label>
<input type="date" id="date" name="date">
</div>
</div>

<fieldset class="form-group fieldset-reset">
<legend class="form-label">Gender</legend>
<div class="row">
<label class="radio">
<input type="radio" name="gender" value="male">
<span>Male</span>
</label>
<label class="radio">
<input type="radio" name="gender" value="female">
<span>Female</span>
</label>
</div>
</fieldset>

<fieldset class="form-group fieldset-reset">
<legend class="form-label">What do you like?</legend>
<div class="row">
<label class="checkbox">
<input type="checkbox" name="skills" value="html">
<span>HTML</span>
</label>
<label class="checkbox">
<input type="checkbox" name="skills" value="css">
<span>CSS</span>
</label>
<label class="checkbox">
<input type="checkbox" name="skills" value="js">
<span>JS</span>
</label>
</div>
</fieldset>

<div class="form-group">
<label for="course">Choose a course</label>
<select id="course" name="course">
<option value="">Select a course</option>
<option value="html">HTML</option>
<option value="css">CSS</option>
<option value="js">JavaScript</option>
</select>
</div>

<div class="form-group">
<label for="message">Message</label>
<textarea id="message" name="message" rows="6" placeholder="Write your message here..."></textarea>
</div>

<div class="form-actions">
<button type="submit" class="btn">Send Message</button>
</div>

</form>
</section>

</main>

<footer class="site-footer">
<div class="container">&copy; Copyrights For Bassam</div>
</footer>

</body>
</html>
